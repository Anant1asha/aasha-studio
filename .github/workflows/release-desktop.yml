name: Release Windows Desktop App (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable & MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install

      - name: Build Core Engine & Web Studio
        run: npm run build

      - name: Build Tauri v2 Windows Installer (.msi / .exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AASHA Studio ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 AASHA Studio Windows Desktop Release
            
            Transform any school textbook PDF into interactive visual learning & gamified assessments.
            
            ### 📦 Installation Instructions
            1. Download `AASHA-Studio-Setup.exe` or the `.msi` installer below.
            2. Run the installer (Zero prerequisites: Node or Rust are NOT required).
            3. Explore the 5 pre-bundled offline demo chapters or provide your OpenRouter / Gemini key to transform your own PDFs.
            
            ---
            *Built automatically via GitHub Actions with Tauri v2.*
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Sign with SignPath Foundation (Conditional)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: SignPath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: 'aasha-studio'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'windows-installer'
          wait-for-completion: true
          output-artifact-directory: 'signed-artifacts'
